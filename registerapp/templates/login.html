{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card card-modern">
          <div class="card-body p-4 p-lg-5">
            <h2 class="page-title mb-2">Login</h2>
            <p class="muted-text mb-4">Access your tickets and events.</p>
            <form method="post">
              {% csrf_token %}
              <input type="hidden" name="next" value="{{ request.GET.next }}">
              {% if form.non_field_errors %}
                <div class="alert alert-danger">{{ form.non_field_errors }}</div>
              {% endif %}
              <div class="mb-3"><label class="form-label" for="id_username">Username</label><input type="text" name="username" class="form-control" id="id_username" required></div>
              <div class="mb-3"><label class="form-label" for="id_password">Password</label><input type="password" name="password" class="form-control" id="id_password" required></div>
              <button type="submit" class="btn btn-modern">Login</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
