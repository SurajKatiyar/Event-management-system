{% extends 'base.html' %}
{% block title %}Signup{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card card-modern">
          <div class="card-body p-4 p-lg-5">
            <h2 class="page-title mb-2">Create Account</h2>
            <p class="muted-text mb-4">Join to register and manage events.</p>
            <form method="post">
              {% csrf_token %}
              {{ form.as_p }}
              <button type="submit" class="btn btn-modern">Signup</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
