{% extends 'base.html' %}
{% block title %}Registered Users{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="card card-modern">
      <div class="card-body p-4">
        <h2 class="page-title mb-4">Registered Users</h2>
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead><tr><th>Name</th><th>Email</th><th>Event Name</th></tr></thead>
            <tbody>
              {% for item in registrations %}
                <tr>
                  <td>{{ item.name }}</td>
                  <td>{{ item.email }}</td>
                  <td>{{ item.event.title }}</td>
                </tr>
              {% empty %}
                <tr><td colspan="3"><div class="py-4 text-center muted-text">No registrations yet.</div></td></tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
