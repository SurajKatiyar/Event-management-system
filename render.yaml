services:
  - type: web
    name: event-management-system
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn event_register.wsgi:application
    autoDeploy: true
    disk:
      name: event-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: SITE_BASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_PRO_MODE
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: event-management-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media

databases:
  - name: event-management-db
    plan: free
